[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haloexec"
version = "0.1.0"
description = "Generic cellular automaton execution engine using domain decomposition (blocks + halo)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Sérgio Costa" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.16,<0.17",     # pinned minor: ruff's default rule set grows across versions
]
# Documentation site (mkdocs.yml); built and deployed by
# .github/workflows/docs_deploy.yml.
docs = [
    "mkdocs>=1.6,<2",           # MkDocs 2.0 drops the plugin/theme system mkdocs-material needs
    "mkdocs-material>=9.5",
    "markdown-callouts>=0.4",   # github-callouts extension (> [!WARNING])
]
# Optional: only needed for the dissmodel adapters
# (HaloChunkedRasterCellularAutomaton, HaloChunkedSyncRasterModel,
# DiskChunkedRasterCellularAutomaton, DiskChunkedSyncRasterModel, in
# ram/ and disk/*_model.py / disk/cellular_automaton.py). engine.py,
# disk/workspace.py, disk/convergence.py and disk/io/ work without it.
dissmodel = ["dissmodel>=0.6.3"]
# Optional: only needed for disk/io/geotiff.py (loading GeoTIFF/VRT
# straight into MemmapRasterWorkspace, block by block).
geotiff = ["rasterio>=1.3"]
# Optional: only needed for disk/io/zarr.py (loading Zarr straight into
# MemmapRasterWorkspace — the second input path, meant for disscube's
# DerivedVariable). Requires zarr-python 3 (create_array/dimension_names
# API), which in turn requires Python >= 3.11.
zarr = ["zarr>=3"]
# Optional: only needed for tests/test_zarr_axis_order_regression.py,
# which reproduces disscube's real write pattern (VariableWriter uses
# xarray.to_zarr()) to validate the axis-order fix.
zarr-test = ["zarr>=3", "xarray>=2024.10"]
# Optional: only needed for tests/test_geomosaic_integration.py, which
# proves that load_geotiff_into_workspace correctly reads a mosaic
# produced by geomosaic (a separate package with no runtime relation to
# haloexec — used here only as an integration proof in tests).
geomosaic = ["geomosaic @ git+https://github.com/LambdaGeo/geomosaic.git"]
# Optional: only needed for examples/gol/ and
# tests/test_gol_patterns_example.py (the equivalence test for that
# example) -- dissmodel-ca provides PATTERNS (classic Game of Life
# patterns) and GameOfLife.
dissmodel-ca = ["dissmodel-ca @ git+https://github.com/DisSModel/dissmodel-ca.git"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Restrict pytest's default discovery to tests/ -- otherwise the example
# scripts in examples/ would be collected by a bare `pytest` at the
# repository root.
testpaths = ["tests"]

[tool.ruff]
# Same policy as DisSModel/dissmodel and DisSModel/disscube: no explicit
# `select`, lint with ruff's own default rule set for the pinned minor
# version (see the `ruff` pin in the `dev` extra). If bumping that pin
# changes CI results, reconcile by fixing the code or, for a rule that is a
# bad fit, adding it to an explicit `ignore` here — not by re-pinning
# silently.
# line-length is informational: E501 is not in the default rules.
line-length = 120
target-version = "py310"
exclude = ["docs", "site", "build"]
