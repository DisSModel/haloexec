[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haloexec"
version = "0.1.0"
description = "Motor genérico de execução de Autômatos Celulares por decomposição de domínio (blocos+halo)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Opcional: só necessário para HaloChunkedRasterCellularAutomaton,
# HaloChunkedSyncRasterModel, DiskChunkedSyncRasterModel
# (dissmodel_ca.py, sync_model.py, disk_sync_model.py) -- os únicos 3
# módulos do haloexec que dependem de dissmodel. Os outros 5
# (engine.py, disk_backend.py, convergence.py, geotiff_io.py,
# zarr_io.py) funcionam sem dissmodel instalado.
dissmodel = ["dissmodel>=0.6.3"]
# Opcional: só necessário para geotiff_io.py (carregamento de GeoTIFF/VRT
# direto para MemmapRasterWorkspace, bloco a bloco).
geotiff = ["rasterio>=1.3"]
# Opcional: só necessário para zarr_io.py (carregamento de Zarr direto
# para MemmapRasterWorkspace — segunda opção de entrada, pensada para
# consumir DerivedVariable do disscube).
zarr = ["zarr>=2.16"]
# Opcional: só necessário para tests/test_zarr_axis_order_regression.py,
# que reproduz o padrão real de escrita do disscube (VariableWriter usa
# xarray.to_zarr()) para validar a correção de ordem de eixos.
zarr-test = ["zarr>=2.16", "xarray>=2023.1"]
# Opcional: só necessário para tests/test_geomosaic_integration.py, que
# prova que load_geotiff_into_workspace lê corretamente um mosaico
# produzido pelo geomosaic (pacote separado, sem relação de runtime
# com haloexec — só usado aqui como prova de integração em teste).
geomosaic = ["geomosaic @ git+https://github.com/LambdaGeo/geomosaic.git"]
# Opcional: só necessário para examples/gol_patterns/gol_patterns_haloexec.py
# e tests/test_gol_patterns_example.py (o teste de equivalência desse
# exemplo) -- dissmodel-ca fornece PATTERNS (padrões clássicos de Game
# of Life) e dissmodel.visualization.RasterMap.
dissmodel-ca = ["dissmodel-ca @ git+https://github.com/DisSModel/dissmodel-ca.git"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Restringe a descoberta padrão do pytest a tests/ -- sem isso, os
# scripts de exemplo em examples/ seriam coletados automaticamente por
# um `pytest` sem argumento na raiz do repositório.
testpaths = ["tests"]
